<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12393c"/><stop offset="1" stop-color="#071b1f"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35895b"/><stop offset="1" stop-color="#236644"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f5a3c"/><stop offset="1" stop-color="#123724"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d064"/><stop offset="1" stop-color="#b07f24"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9aeb6"/><stop offset="1" stop-color="#565b63"/>
    </linearGradient>
    <clipPath id="bobTop"><rect x="340" y="70" width="104" height="50"/></clipPath>
    <clipPath id="bobBottom"><rect x="340" y="120" width="104" height="52"/></clipPath>
  </defs>

  <!-- water -->
  <rect width="512" height="512" rx="96" fill="url(#water)"/>
  <g fill="none" stroke="#2b6a6c" stroke-width="3" opacity="0.55">
    <ellipse cx="256" cy="436" rx="210" ry="26"/>
    <ellipse cx="256" cy="444" rx="150" ry="16"/>
  </g>

  <!-- fishing line from the rod tip, off the top-left corner, to the bobber -->
  <path d="M -10 40 C 120 10, 300 -4, 402 40" fill="none" stroke="#d9e6e2" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

  <!-- shadow under the box -->
  <ellipse cx="256" cy="410" rx="176" ry="16" fill="#000" opacity="0.35"/>

  <!-- carry handle -->
  <rect x="200" y="176" width="14" height="34" rx="4" fill="url(#steel)"/>
  <rect x="298" y="176" width="14" height="34" rx="4" fill="url(#steel)"/>
  <rect x="184" y="156" width="144" height="26" rx="13" fill="url(#steel)"/>
  <rect x="196" y="161" width="120" height="5" rx="2.5" fill="#fff" opacity="0.35"/>

  <!-- body -->
  <rect x="88" y="262" width="336" height="146" rx="24" fill="url(#body)"/>
  <!-- lid -->
  <rect x="80" y="200" width="352" height="78" rx="24" fill="url(#lid)"/>
  <rect x="100" y="212" width="312" height="9" rx="4.5" fill="#fff" opacity="0.16"/>
  <rect x="100" y="232" width="312" height="5" rx="2.5" fill="#fff" opacity="0.08"/>
  <!-- seam -->
  <rect x="88" y="272" width="336" height="7" fill="#06140d"/>

  <!-- embossed fish on the body -->
  <g fill="#2f7a52" opacity="0.9">
    <path d="M 128 344 C 150 318, 196 318, 222 344 C 196 370, 150 370, 128 344 Z"/>
    <path d="M 218 344 L 248 322 L 242 344 L 248 366 Z"/>
    <circle cx="150" cy="339" r="4" fill="#123724"/>
  </g>
  <!-- moulded ribs on the right -->
  <g fill="#0d2a1b" opacity="0.7">
    <rect x="300" y="312" width="96" height="6" rx="3"/>
    <rect x="300" y="330" width="96" height="6" rx="3"/>
    <rect x="300" y="348" width="96" height="6" rx="3"/>
    <rect x="300" y="366" width="96" height="6" rx="3"/>
  </g>
  <!-- corner rivets -->
  <g fill="#0a2116"><circle cx="110" cy="386" r="5"/><circle cx="402" cy="386" r="5"/></g>

  <!-- brass latch over the seam -->
  <rect x="228" y="246" width="56" height="62" rx="8" fill="url(#brass)" stroke="#6e4d12" stroke-width="2"/>
  <rect x="238" y="254" width="36" height="6" rx="3" fill="#fff" opacity="0.4"/>
  <circle cx="256" cy="284" r="7" fill="#4a3208"/>
  <rect x="253" y="284" width="6" height="14" rx="3" fill="#4a3208"/>

  <!-- bobber: red over white, no band, with a long stem -->
  <g transform="rotate(14 392 120)">
    <rect x="387" y="38" width="10" height="40" rx="4" fill="#d8342c"/>
    <rect x="387" y="36" width="10" height="10" rx="4" fill="#f4efe2"/>
    <rect x="388" y="160" width="8" height="26" rx="4" fill="#c9c2b0"/>
    <circle cx="392" cy="120" r="46" fill="#d8342c" clip-path="url(#bobTop)"/>
    <circle cx="392" cy="120" r="46" fill="#f4efe2" clip-path="url(#bobBottom)"/>
    <circle cx="392" cy="120" r="46" fill="none" stroke="#0b1a1c" stroke-width="4"/>
    <ellipse cx="374" cy="99" rx="12" ry="7" fill="#fff" opacity="0.5" transform="rotate(-35 374 99)"/>
  </g>
</svg>
